[workspace]
members = ["crates/segwire-daemon", "crates/segwire-cli", "crates/segwire-common", "crates/segwire-test"]
resolver = "2"

[workspace.dependencies]
# D-Bus communication
zbus = "3.0"
zvariant = "3.0"

# Command-line interface
clap = { version = "4.0", features = ["derive"] }

# Output formatting
tabled = "0.14"
serde_json = "1.0"

# Async runtime with io_uring
monoio = { version = "0.2", features = ["sync", "macros"] }

# Configuration parsing
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Validation
regex = "1.0"

# Network namespace management
netlink-tpc = { path = "../tpc-libs/crates/netlink-tpc", features = ["monoio-rt"] }
netlink-packet-route = "0.25"
netlink-packet-core = "0.8"
nix = { version = "0.27", features = ["user", "process", "sched", "mount", "fs"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Internal crates
segwire-common = { path = "crates/segwire-common" }

# File system monitoring
inotify-tpc = { path = "../tpc-libs/crates/inotify-tpc", features = ["monoio-rt"] }
