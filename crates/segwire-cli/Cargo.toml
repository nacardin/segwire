[package]
name = "segwire-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for segwire network namespace management"

[dependencies]
# Shared library
segwire-common = { workspace = true }

# D-Bus communication
dbus = { workspace = true }

# Unix syscalls (for exec)
nix = { workspace = true }

# Command-line interface
clap = { workspace = true }

# Serialization
serde = { workspace = true }

# Output formatting
tabled = { workspace = true }

# Configuration parsing
toml = { workspace = true }



# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Timestamp formatting
time = { version = "0.3", features = ["formatting", "macros"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
dbus-crossroads = { workspace = true }
