[package]
name = "segwire-daemon"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2021"
description = "System daemon for managing Linux network namespaces"

[dependencies]
# Shared library
segwire-common = { workspace = true }

# Netlink socket abstractions
segwire-netlink = { workspace = true }

# D-Bus communication
dbus = { workspace = true }
dbus-crossroads = { workspace = true }

# Network namespace management (syscalls)
nix = { workspace = true }

# Netlink message building/parsing (operations still live here)
netlink-packet-route = { workspace = true }
netlink-packet-core = { workspace = true }

# WireGuard message building
netlink-packet-wireguard = { workspace = true }
base64 = { workspace = true }

# Configuration parsing
toml = { workspace = true }
serde = { workspace = true }

# File system monitoring
inotify = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }
ctrlc = "3.5.2"

[dev-dependencies]
tempfile = "3.8"


