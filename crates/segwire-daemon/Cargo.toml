[package]
name = "segwire-daemon"
version = "0.1.0"
edition = "2021"
description = "System daemon for managing Linux network namespaces"

[dependencies]
# Shared library
segwire-common = { workspace = true }

# D-Bus communication
zbus = { workspace = true }
zvariant = { workspace = true }

# Network namespace management
nix = { workspace = true }

# Configuration parsing
toml = { workspace = true }
serde = { workspace = true }

# File system monitoring with io_uring
monoio = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }
async-lock = "3.4.2"
ctrlc = "3.5.2"
inotify = { version = "0.10", default-features = false }
local-sync = "0.1"

[dev-dependencies]
tempfile = "3.8"
